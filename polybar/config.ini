[colors]
background     = #000000
foreground     = #E0E0E0
primary        = #FF2A00
alert          = #FF0000
white          = #FFFFFF
green          = #00FF88
disabled       = #555555

[bar/main]
width = 100%
height = 30
background = ${colors.background}
foreground = ${colors.foreground}
line-size = 2
line-color = ${colors.primary}
padding-left = 2
padding-right = 2
module-margin = 2

font-0 = JetBrains Mono:style=Medium:size=11;2
font-1 = FontAwesome:size=11;2
font-2 = FontAwesome:size=12;2

modules-left   = bspwm
modules-center =
modules-right  = cpu brightness network battery pulseaudio date

wm-restack = bspwm
enable-ipc = true
cursor-click = pointer

;-----------------------------------------------
; Workspaces
;-----------------------------------------------
[module/bspwm]
type = internal/bspwm
pin-workspaces = true
enable-click = true
enable-scroll = true

label-focused = %index%
label-focused-background = #1a1a1a
label-focused-foreground = ${colors.primary}
label-focused-underline = ${colors.primary}
label-focused-padding = 2

label-occupied = %index%
label-occupied-foreground = ${colors.primary}
label-occupied-padding = 2

label-empty = %index%
label-empty-foreground = ${colors.white}
label-empty-padding = 2

label-urgent = %index%
label-urgent-background = ${colors.alert}
label-urgent-foreground = #000000
label-urgent-padding = 2

;-----------------------------------------------
; CPU
;-----------------------------------------------
[module/cpu]
type = internal/cpu
interval = 2
format = <label>
label = %{F#FF2A00}%{F-} %percentage%%
label-foreground = ${colors.foreground}

;-----------------------------------------------
; Brillo
;-----------------------------------------------
[module/brightness]
type = internal/backlight
card = amdgpu_bl0
format = <label>
label = %{F#FF2A00}%{F-} %percentage%%
use-actual-brightness = true
enable-scroll = true

;-----------------------------------------------
; Network
;-----------------------------------------------
[module/network]
type = internal/network
interface = wlp1s0
interval = 3

format-connected = <label-connected>
format-disconnected = <label-disconnected>

label-connected = %{F#FF2A00}%{F-} %essid%
label-disconnected = %{F#FF2A00}%{F-} offline
label-disconnected-foreground = ${colors.alert}

;-----------------------------------------------
; Battery
;-----------------------------------------------
[module/battery]
type = internal/battery
battery = BAT0
adapter = AC
full-at = 98
poll-interval = 5

format-charging = <animation-charging> <label-charging>
format-discharging = <ramp-capacity> <label-discharging>
format-full = <ramp-capacity> <label-full>

label-charging = %percentage%%
label-discharging = %percentage%%
label-full = %percentage%%

ramp-capacity-0 = %{F#FF2A00}%{F-}
ramp-capacity-1 = %{F#FF2A00}%{F-}
ramp-capacity-2 = %{F#FF2A00}%{F-}
ramp-capacity-3 = %{F#FF2A00}%{F-}
ramp-capacity-4 = %{F#FF2A00}%{F-}

animation-charging-0 = %{F#FF2A00}%{F-}
animation-charging-1 = %{F#FF2A00}%{F-}
animation-charging-2 = %{F#FF2A00}%{F-}
animation-charging-3 = %{F#FF2A00}%{F-}
animation-charging-4 = %{F#FF2A00}%{F-}
animation-charging-framerate = 750

;-----------------------------------------------
; Volume
;-----------------------------------------------
[module/pulseaudio]
type = internal/pulseaudio
use-ui-max = true
interval = 5

format-volume = <ramp-volume> <label-volume>
format-muted = <label-muted>

label-volume = %percentage%%
label-muted = %{F#FF2A00}%{F-} muted
label-muted-foreground = ${colors.alert}

ramp-volume-0 = %{F#FF2A00}%{F-}
ramp-volume-1 = %{F#FF2A00}%{F-}
ramp-volume-2 = %{F#FF2A00}%{F-}

click-right = pavucontrol

;-----------------------------------------------
; Date
;-----------------------------------------------
[module/date]
type = internal/date
interval = 1
date = %H:%M
label = %date%
