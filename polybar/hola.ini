[colors]
background     = #000000
background-alt = #111111
foreground     = #E0E0E0
primary        = #FF2A00          ; rojo fuego
secondary      = #FF4500
alert          = #FF0000
disabled       = #555555
white          = #FFFFFF
green          = #00FF88

[bar/main]
width = 100%
height = 30
radius = 0
fixed-center = true

background = ${colors.background}
foreground = ${colors.foreground}

line-size = 2
line-color = ${colors.primary}

border-size = 0
padding-left = 1
padding-right = 1
module-margin = 1

font-0 = JetBrains Mono:style=Medium:size=11;2
font-1 = FontAwesome:size=11;2
font-2 = FontAwesome:size=12;2

modules-left   = bspwm
modules-center =
modules-right  = network battery pulseaudio date

wm-restack = bspwm
enable-ipc = true
cursor-click = pointer
cursor-scroll = ns-resize

;-----------------------------------------------
; Workspaces (números)
;-----------------------------------------------
[module/bspwm]
type = internal/bspwm
pin-workspaces = true
enable-click = true
enable-scroll = true
reverse-scroll = true

; Escritorio actual (enfocado)
label-focused = %index%
label-focused-background = #1a1a1a
label-focused-foreground = ${colors.primary}
label-focused-padding = 2
label-focused-underline = ${colors.primary}

; Escritorios que tienen ventanas (usados)
label-occupied = %index%
label-occupied-foreground = ${colors.primary}
label-occupied-padding = 2

; Escritorios vacíos (no usados)
label-empty = %index%
label-empty-foreground = ${colors.white}
label-empty-padding = 2

; Urgente
label-urgent = %index%
label-urgent-background = ${colors.alert}
label-urgent-foreground = #000000
label-urgent-padding = 2

;-----------------------------------------------
; Network (wifi)
;-----------------------------------------------
[module/network]
type = internal/network
interface = wlp1s0
interval = 3.0
accumulate-stats = true
unknown-as-up = true

format-connected = <label-connected>
format-disconnected = <label-disconnected>

label-connected = %{A1:nm-connection-editor:}  %essid%%{A}
label-connected-foreground = ${colors.primary}

label-disconnected =   offline
label-disconnected-foreground = ${colors.alert}

;-----------------------------------------------
; Battery
;-----------------------------------------------
[module/battery]
type = internal/battery
battery = BAT0
adapter = AC
full-at = 98
poll-interval = 5
time-format = %H:%M

format-charging = <animation-charging> <label-charging>
format-discharging = <ramp-capacity> <label-discharging>
format-full = <ramp-capacity> <label-full>
format-low = <ramp-capacity> <label-low>

label-charging = %percentage%%
label-discharging = %percentage%%
label-full = %percentage%%
label-low = %percentage%%

label-charging-foreground = ${colors.green}
label-discharging-foreground = ${colors.primary}
label-full-foreground = ${colors.green}
label-low-foreground = ${colors.alert}

ramp-capacity-0 = 
ramp-capacity-1 = 
ramp-capacity-2 = 
ramp-capacity-3 = 
ramp-capacity-4 = 
ramp-capacity-foreground = ${colors.primary}
ramp-capacity-0-foreground = ${colors.alert}
ramp-capacity-1-foreground = ${colors.alert}

animation-charging-0 = 
animation-charging-1 = 
animation-charging-2 = 
animation-charging-3 = 
animation-charging-4 = 
animation-charging-framerate = 750
animation-charging-foreground = ${colors.primary}

;-----------------------------------------------
; Volume
;-----------------------------------------------
[module/pulseaudio]
type = internal/pulseaudio
use-ui-max = true
interval = 5

format-volume = <ramp-volume> <label-volume>
format-muted = <label-muted>

label-volume = %percentage%%
label-muted =  muted
label-muted-foreground = ${colors.alert}

ramp-volume-0 = 
ramp-volume-1 = 
ramp-volume-2 = 
ramp-volume-foreground = ${colors.primary}

click-right = pavucontrol

;-----------------------------------------------
; Date
;-----------------------------------------------
[module/date]
type = internal/date
interval = 1

date = %H:%M
date-alt = %A %d/%m/%Y  %H:%M

label = %date%
label-foreground = ${colors.foreground}

;-----------------------------------------------
; Tray
;-----------------------------------------------
[module/tray]
type = internal/tray
format-margin = 4px
tray-spacing = 8px
tray-size = 70%
